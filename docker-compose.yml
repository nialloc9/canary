version: "3.9"

services:
  db:
    image: postgres:16-alpine
    env_file: .env.dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      target: dev
    env_file: .env.dev
    volumes:
      - ./backend:/app        # hot-reload
      - ./terraform:/app/terraform:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app        # hot-reload
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

  init:
    image: python:3.12-slim
    env_file: scripts/init/.env
    volumes:
      - ./scripts/init:/scripts/init
    working_dir: /scripts/init
    command: >
      sh -c "pip install -q -r requirements.txt && python init.py"
    profiles:
      - init
    depends_on:
      - backend

volumes:
  postgres_data:
